name: Build wheels and publish to PyPI

# When to run:
#   - On any push of a tag like ``v4.1.4`` -- builds platform wheels for
#     Linux / macOS / Windows, runs a quick smoke test on each, then uploads
#     everything to PyPI using the ``pypi_token`` repo secret.
#   - On a manual trigger from the GitHub Actions UI ("Run workflow") --
#     builds the wheels and uploads them as workflow artifacts, but does
#     *not* publish. Use this to dry-run the pipeline before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let a single platform failure cancel the others; we want to see
      # exactly which OS broke so a fix is one-targeted.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.21.3
        # All cibuildwheel config (build matrix, test command, skips) lives in
        # ``pyproject.toml`` under ``[tool.cibuildwheel]`` so it's reused by
        # anyone running ``cibuildwheel`` locally.

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish when a version tag was pushed. Manual dispatch builds
    # artifacts you can download from the run page, but doesn't release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts into dist/
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what we're about to publish
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.pypi_token }}
          # Skip if any of these files already exist on PyPI (e.g. retrying
          # a partially-published release). Without this the whole upload
          # fails on the first duplicate.
          skip-existing: true
