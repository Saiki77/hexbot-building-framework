name: Featured bots

# Regenerate the Featured Community Bots table in README.md from
# leaderboard.json. Triggered when leaderboard.json changes on main,
# weekly to keep "rated" dates fresh, or manually.

on:
  push:
    branches: [main]
    paths:
      - leaderboard.json
      - scripts/update_featured_bots.py
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate Featured Bots table
        run: |
          python scripts/update_featured_bots.py --top 10

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No change to README.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Regenerate Featured Community Bots table"
          git push
