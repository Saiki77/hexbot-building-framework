name: PR smoke

# Fast checks that run on every PR (and pushes to main): unit tests +
# a tiny 2-iteration training smoke run. The goal is to catch obvious
# regressions in the training pipeline before a maintainer has to
# review the diff. Total runtime target: under 5 minutes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Tests + training smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install package in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run unit tests
        run: pytest tests/ -q --maxfail=3
        continue-on-error: false

      - name: Scaffolder smoke (orca init)
        run: |
          python -m orca init demo-bot --profile=cpu-only
          test -f demo-bot/train.sh
          test -f demo-bot/README.md
          test -x demo-bot/train.sh

      # A real training run was attempted in earlier iterations of this
      # workflow but a 2-iteration self-play with even tiny configs
      # exceeds the free GitHub CPU runner's reasonable time budget
      # (~10 minutes). The unit tests in `tests/` already exercise the
      # full pipeline at the function level (including the v4.2.x
      # additions: profiles, scaffolder, checkpoint metadata, atomic
      # save). End-to-end training validation belongs on a paid GPU
      # runner if you ever wire one up.
