[build-system]
requires = ["setuptools>=68.0,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexbot"
version = "4.1.4"
description = "Python framework for building AI bots for Hexagonal Connect-6"
readme = "README.md"
# license in classifiers below
requires-python = ">=3.9"
authors = [
    {name = "Saiki77"},
]
keywords = ["hex", "connect-6", "ai", "bot", "mcts", "alphazero", "neural-network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "torch>=2.0",
    "requests",
]

[project.optional-dependencies]
dashboard = [
    "flask>=2.0",
    "flask-socketio>=5.0",
    "psutil",
]
distributed = [
    "ray>=2.0",
]
tensorboard = [
    "tensorboard",
]
wandb = [
    "wandb",
]
sweep = [
    "optuna>=3.0",
]
all = [
    "flask>=2.0",
    "flask-socketio>=5.0",
    "psutil",
    "ray>=2.0",
    "requests",
    "onnxruntime",
    "onnxscript",
    "tensorboard",
    "wandb",
    "optuna>=3.0",
]

[project.urls]
Homepage = "https://github.com/Saiki77/hexbot-building-framework"
Repository = "https://github.com/Saiki77/hexbot-building-framework"

[project.scripts]
orca-train = "orca.train:main"
orca-sft = "orca.sft:main"
orca-scrape = "orca.scrape:main"

[tool.setuptools.packages.find]
include = ["orca*"]

[tool.setuptools]
py-modules = ["hexbot", "hexgame", "bot", "main", "dashboard"]

[tool.setuptools.package-data]
orca = ["engine.c"]
"*" = ["engine.c"]

# ---------------------------------------------------------------------------
# cibuildwheel: how the GitHub Actions release workflow builds binary wheels
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
# Python versions to build. Keep in sync with `requires-python` above.
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
# musllinux roughly doubles build time and only helps Alpine users; skip
# unless someone asks. PyPy and 32-bit are also out of scope.
skip = "*-musllinux* pp* *-win32 *-manylinux_i686"
# Quick smoke test on every freshly built wheel: import hexgame (which lives
# at the top level, not inside any heavy package) and confirm the engine
# loads + basic state transitions work. This catches packaging regressions
# without dragging torch/numpy into the test env.
test-command = 'python -c "import hexgame; g = hexgame.HexGame(); g.place(0,0); g.place(1,0); assert g.total_stones == 2; print(\"engine OK\")"'

[tool.cibuildwheel.linux]
# Use the default manylinux_2_28 image -- it has gcc 12+ and works with
# anything CPython 3.9+ users typically run.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
